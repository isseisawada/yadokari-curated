# YADOKARI CURATED の設定。秘匿値（DATABASE_URL・ANTHROPIC_API_KEY）はここに書かない。

app:
  db_path: data/yadokari.db
  log_dir: logs
  timezone: Asia/Tokyo

http:
  user_agent: "YADOKARI-curated/0.1 (+mailto:sawada@yadokari.net)"
  request_interval_sec: 3.0      # 下限3秒。これ未満は起動時に弾く
  max_concurrency_per_domain: 1  # 同一ドメインへの並列は禁止
  timeout_sec: 30
  max_retries: 3
  respect_robots_txt: true       # 無効にはできない

collect:
  lookback_days: 30
  per_source_limit: 20
  min_text_chars: 400

# ソース。実測は docs/source-survey.md（2026-09-28）。
# 採用はユーザー判断（2026-09-28）: 本命6つ + Dezeen（フィードのみ）+ Tiny House Blog・Gessato
# 利用規約の確認（2026-09-28・docs/source-survey.md）。
# **ArchDaily・Dwell・Gessato は規約で自動収集を禁じているが、ユーザー判断で自動収集する
# （2026-09-29）。** robots.txt・3秒間隔・UA の連絡先・回避をしない、は変えない。
# color は審査画面の媒体ラベルの色。各サイトの雰囲気に寄せた目安（公式のブランド色ではない）。
# 承認の青・非承認の赤とは被らないようにしてある
sources:
  - name: archdaily
    color: "#F08C1E"
    # 利用規約: "use an automatic device (such as a robot or spider) or manual process to copy
    # or scrape the Website ... without the express written permission of ArchDaily" を禁止
    # サイト全体のフィードは窓が1.4日しかない。cabins-and-lodges の一覧を入口にする
    index_urls: ["https://www.archdaily.com/category/cabins-and-lodges"]
    url_include: '^https://www\.archdaily\.com/\d{6,}/[a-z0-9-]+$'
    lookback_days: 365           # 一覧に少し前の作品も並ぶ（30日だと24件中15件が落ちた）
    backfill_url: "https://www.archdaily.com/category/cabins-and-lodges?page={page}"
    note: "規約で自動収集禁止。ユーザー判断で収集（2026-09-29）"
  - name: dwell
    color: "#2B2B2B"
    # 利用規約（Ziff Davis）: "use any robot, spider ... to crawl, scrape ... harvest, gather,
    # extract, retrieve or index any portion of the Services" を禁止
    feed: "https://www.dwell.com/@dwell/rss"
    prefilter: true              # 住宅全般のフィードなので絞る
    note: "規約で自動収集禁止。ユーザー判断で収集（2026-09-29）"
  - name: tinyhousetalk
    color: "#4E8A2E"
    feed: "https://tinyhousetalk.com/feed/"
    backfill_url: "https://tinyhousetalk.com/feed/?paged={page}"
  - name: newatlas
    color: "#0086A8"
    feed: "https://newatlas.com/tiny-houses/index.rss"
    # 過去記事は一覧ページをめくる（フィードはページ送りが無い）
    url_include: '^https://newatlas\.com/[a-z-]+/[a-z0-9-]{12,}/?$'
    backfill_url: "https://newatlas.com/tiny-houses/?page={page}"
  - name: designboom
    color: "#8B1E3F"
    feed: "https://www.designboom.com/tag/cabin/feed/"
    backfill_url: "https://www.designboom.com/tag/cabin/feed/?paged={page}"
  - name: leibal
    color: "#B5AFA4"
    feed: "https://leibal.com/feed/"
    prefilter: true              # 家具・プロダクトも混ざる
  - name: dezeen
    color: "#000000"
    feed: "https://www.dezeen.com/tag/cabins/feed/"
    backfill_url: "https://www.dezeen.com/tag/cabins/feed/?paged={page}"
    fetch_article: false         # 記事ページはデータセンターから 403。フィードが全文
  - name: dezeen-micro
    color: "#000000"
    feed: "https://www.dezeen.com/tag/micro-homes/feed/"
    backfill_url: "https://www.dezeen.com/tag/micro-homes/feed/?paged={page}"
    fetch_article: false
  - name: tinyhouseblog
    color: "#8B5A2B"
    feed: "https://tinyhouseblog.com/feed/"
  - name: gessato
    color: "#6D4C8D"
    # 利用規約: "prohibited from using any data mining, robots, or other data gathering
    # systems and extraction tools" を禁止
    feed: "https://www.gessato.com/feed/"
    prefilter: true
    note: "規約で自動収集禁止。ユーザー判断で収集（2026-09-29）"

  # 2026-10-03 追加（ユーザー指定: 媒体を増やす）。robots.txt で記事・フィードは許可を確認済み。
  # 利用規約は未確認
  - name: inhabitat
    color: "#5B8C5A"
    feed: "https://inhabitat.com/tag/tiny-homes/feed/"
    backfill_url: "https://inhabitat.com/tag/tiny-homes/feed/?paged={page}"
  - name: yankodesign
    color: "#C9A227"
    feed: "https://www.yankodesign.com/tag/tiny-house/feed/"
    backfill_url: "https://www.yankodesign.com/tag/tiny-house/feed/?paged={page}"
    prefilter: true              # プロダクトデザインの媒体なので絞る
  - name: manual
    color: "#9B9B9B"
    # 上のどれにも当たらない媒体・ビルダーの自社サイトを人が入れるとき
    manual_only: true

scoring:
  # 採点はざっくりでよい（2026-09-29 ユーザー判断: 課金を下げたい）。いちばん安い Haiku 4.5
  # （Opus 5.5 の約1/4の単価）。Haiku は effort を受け付けない（送ると 400）ので null。
  # server-side fallback も Haiku では使わない
  model: claude-haiku-4-5
  effort: null
  fallbacks: false
  max_tokens: 4000
  review_threshold: 50
  # 軸の案（docs/scoring.md）。承認実績が溜まったら見直す。合計 1.0
  weights:
    design: 0.22       # デザイン性（LLM）
    story: 0.22        # 暮らし方の物語（LLM）
    smallness: 0.13    # 小さい／動く度合い（LLM の種別判定から Python で点にする）
    photos: 0.13       # 写真の枚数（記事から数える）
    japan: 0.10        # 日本の読者との接点（LLM）
    seo: 0.10          # 「トレーラーハウス」で上位を狙える題材か（種別から。2026-09-29 追加）
    facts: 0.05        # 設計者・国・面積・価格が揃っているか（抽出結果から数える）
    freshness: 0.05    # 元記事の新しさ（公開日から）

drafting:
  model: claude-opus-5-5
  effort: medium
  max_images: 8
  target_chars: 1600
  title_prefix: "【海外事例】"

wordpress:
  base_url: "https://yadokari.net"
  category_ids: [2184]          # タイニーハウス、最前線
  # 予約投稿を許すか。2026-09-30 ユーザーが WP 上の下書きを確認して OK（予約を有効化）
  allow_schedule: true
  # 承認したら自動で下書き → 空いている最短の枠へ予約（毎時の auto.yml。2026-09-30 ユーザー指定）
  # 止めるときは false
  auto_schedule: true
  # 2026-10-03 ユーザー指定: 今年末までは1日1本（08:00）、2027年から1日2本（08:00・16:00）
  post_times: ["08:00"]
  post_times_from:
    "2027-01-01": ["08:00", "16:00"]
  slug_prefix: "yc-"
  # アイキャッチは元写真を WP に取り込む（既存記事と同じ。2026-09-28 ユーザー判断）
  upload_featured_image: true

# SEO / AIO（2026-09-29）。詳しくは docs/seo.md
seo:
  required_tags: ["タイニーハウス", "小屋"]    # すべての記事に付ける
  trailer_tags: ["トレーラーハウス"]           # トレーラー系には追加で付ける
  tag_ids: {"タイニーハウス": 274, "小屋": 162, "トレーラーハウス": 323}
  description_min: 80
  description_max: 120
  data_box: true
  faq: true
  send_facts_meta: false        # wordpress-plugin/ を入れてから true

x:
  # 記事の公開と同時に X（@yadokari_mobi）へ投稿する。投稿するのは WP の mu-plugin（yadokari-curated-x.php）。
  # 2026-09-30 ユーザーが投稿文の形を確認して OK。止めるときは false（次に送る記事から投稿文を渡さない）
  enabled: true
