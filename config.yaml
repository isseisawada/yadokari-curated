# YADOKARI CURATED の設定。秘匿値（DATABASE_URL・ANTHROPIC_API_KEY）はここに書かない。

app:
  db_path: data/yadokari.db
  log_dir: logs
  timezone: Asia/Tokyo

http:
  user_agent: "YADOKARI-curated/0.1 (+mailto:sawada@yadokari.net)"
  request_interval_sec: 3.0      # 下限3秒。これ未満は起動時に弾く
  max_concurrency_per_domain: 1  # 同一ドメインへの並列は禁止
  timeout_sec: 30
  max_retries: 3
  respect_robots_txt: true       # 無効にはできない

collect:
  lookback_days: 30
  per_source_limit: 20
  min_text_chars: 400

# ソース。実測は docs/source-survey.md（2026-09-28）。
# 採用はユーザー判断（2026-09-28）: 本命6つ + Dezeen（フィードのみ）+ Tiny House Blog・Gessato
# 利用規約（自動収集の禁止）は未確認。確認できたら note に書く。
sources:
  - name: archdaily
    # サイト全体のフィードは窓が1.4日しかない。cabins-and-lodges の一覧を入口にする
    index_urls: ["https://www.archdaily.com/category/cabins-and-lodges"]
    url_include: '^https://www\.archdaily\.com/\d{6,}/[a-z0-9-]+$'
  - name: dwell
    feed: "https://www.dwell.com/@dwell/rss"
    prefilter: true              # 住宅全般のフィードなので絞る
  - name: tinyhousetalk
    feed: "https://tinyhousetalk.com/feed/"
  - name: newatlas
    feed: "https://newatlas.com/tiny-houses/index.rss"
  - name: designboom
    feed: "https://www.designboom.com/tag/cabin/feed/"
  - name: leibal
    feed: "https://leibal.com/feed/"
    prefilter: true              # 家具・プロダクトも混ざる
  - name: dezeen
    feed: "https://www.dezeen.com/tag/cabins/feed/"
    fetch_article: false         # 記事ページはデータセンターから 403。フィードが全文
  - name: dezeen-micro
    feed: "https://www.dezeen.com/tag/micro-homes/feed/"
    fetch_article: false
  - name: tinyhouseblog
    feed: "https://tinyhouseblog.com/feed/"
  - name: gessato
    feed: "https://www.gessato.com/feed/"
    prefilter: true

scoring:
  model: claude-opus-5-5
  effort: low
  max_tokens: 16000
  review_threshold: 50
  # 軸の案（docs/scoring.md）。承認実績が溜まったら見直す。合計 1.0
  weights:
    design: 0.25       # デザイン性（LLM）
    story: 0.25        # 暮らし方の物語（LLM）
    smallness: 0.15    # 小さい／動く度合い（LLM の種別判定から Python で点にする）
    photos: 0.15       # 写真の枚数（記事から数える）
    japan: 0.10        # 日本の読者との接点（LLM）
    facts: 0.05        # 設計者・国・面積・価格が揃っているか（抽出結果から数える）
    freshness: 0.05    # 元記事の新しさ（公開日から）

drafting:
  model: claude-opus-5-5
  effort: medium
  max_images: 8
  target_chars: 1600
  title_prefix: "【海外事例】"

wordpress:
  base_url: "https://yadokari.net"
  category_ids: [2184]          # タイニーハウス、最前線
  # 予約投稿を許すか。最初は下書き（status=draft）だけ。WP 上で見て OK が出たら true
  allow_schedule: false
  post_times: ["19:00"]         # 既存記事の大半が 19:00。数を増やすと1日の本数が増える
  slug_prefix: "yc-"
  # アイキャッチは元写真を WP に取り込む（既存記事と同じ。2026-09-28 ユーザー判断）
  upload_featured_image: true
