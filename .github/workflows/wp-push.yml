name: wp-push

# 審査画面で作った下書きを WordPress に**下書き（status=draft）として**送る。公開はしない。
# 予約投稿は config.yaml の wordpress.allow_schedule が true になるまで使えない。
on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: "下書きの番号（審査画面 DRAFTS の #）"
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m yadokari.cli wp push "${{ inputs.draft_id }}"
