name: wp-images

# 公開前の下書きの写真を大きい版に差し替え、WP に送ってあるものは同じ状態（下書き／予約）で送り直す。
# 公開済みの記事は触らない。
on:
  workflow_dispatch:

concurrency:
  group: auto   # 自動予約と同時に走らせない
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m yadokari.cli wp images
