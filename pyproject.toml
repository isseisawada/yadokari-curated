[project]
name = "yadokari-curated"
version = "0.1.0"
description = "YADOKARI.net 世界の小さな家・動く家 キュレーション記事システム"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "anthropic>=1.0",
    # 審査画面
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # 本番の DB（Supabase）。Vercel は requirements.txt より pyproject.toml を優先して
    # dependencies だけを入れるので、extras ではなくここに置く
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# ruff はバージョンを固定する（frmg で、新しい ruff の既定ルール追加により
# CI が30回連続で落ちた）。上げるときは手元で ruff check を通してから。
dev = ["pytest>=8.0", "ruff>=0.16,<0.17", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
yadokari = "yadokari.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yadokari = ["db/migrations/*.sql", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "RUF"]
# 全角の括弧・コロンを「紛らわしい文字」とする指摘と、全角を2桁で数える行長は、
# 日本語のコメントと噛み合わないので外す（frmg と同じ）
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
